name: Update VPN subscription

on:
  schedule:
    # каждый час в начале часа по UTC
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Юзернейм канала (без @). Пусто = переменная TG_CHANNEL'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-vpn-sub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch latest VPN link from Telegram
        env:
          TG_CHANNEL: ${{ github.event.inputs.channel || vars.TG_CHANNEL }}
          SUB_MARKER: ${{ vars.SUB_MARKER }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
          INCLUDE_PATTERN: ${{ vars.INCLUDE_PATTERN }}
          EXCLUDE_PATTERN: ${{ vars.EXCLUDE_PATTERN }}
        run: python scripts/fetch_latest.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "chore: обновление VPN-ссылки (авто)"
            git push
          fi

      # GitHub отключает расписания через 60 дней неактивности репозитория.
      # Это действие раз в ~50 дней делает пустой коммит и не даёт расписанию умереть.
      - name: Keepalive
        uses: gautamkrishnar/keepalive-workflow@v2
