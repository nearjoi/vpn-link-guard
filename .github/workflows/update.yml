name: Update VPN subscription

on:
  schedule:
    # 3 раза в час на «непиковых» минутах (cron ровно в :00 GitHub часто
    # пропускает под нагрузкой; сдвиг на случайную минуту надёжнее).
    - cron: '7,29,51 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Юзернейм канала (без @). Пусто = переменная TG_CHANNEL'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: update-vpn-sub
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Важно: workflow сознательно НЕ использует actions/uses (actions/checkout и т.п.).
    # GitHub периодически блокирует сторонние экшены, и тогда ран падает с
    # "Repository access blocked" ещё до запуска. Чистые run-шаги от этого не зависят.
    steps:
      - name: Clone repository (вместо actions/checkout)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # python3 предустановлен на ubuntu-runner'е, ставим только requests
      - name: Install deps
        run: pip install --quiet requests

      - name: Fetch latest VPN link from Telegram
        env:
          TG_CHANNEL: ${{ github.event.inputs.channel || vars.TG_CHANNEL }}
          SUB_MARKER: ${{ vars.SUB_MARKER }}
          MAX_PAGES: ${{ vars.MAX_PAGES }}
          INCLUDE_PATTERN: ${{ vars.INCLUDE_PATTERN }}
          EXCLUDE_PATTERN: ${{ vars.EXCLUDE_PATTERN }}
        run: python3 scripts/fetch_latest.py

      - name: Commit and push if changed
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Изменений нет — коммит не нужен"
          else
            git commit -m "chore: обновление VPN-ссылки (авто)"
            git push
          fi

      # GitHub отключает расписания через 60 дней неактивности репозитория.
      # Аналог keepalive-workflow без внешнего экшена: раз в ~50 дней пустой коммит.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age=$(( (now - last) / 86400 ))
          if [ "$age" -ge 50 ]; then
            git commit --allow-empty -m "chore: keepalive — защита расписания от автоотключения"
            git push
            echo "Пустой keepalive-коммит сделан (репозиторий молчал ${age} дней)"
          else
            echo "Последний коммит ${age} дн. назад — keepalive не нужен"
          fi
